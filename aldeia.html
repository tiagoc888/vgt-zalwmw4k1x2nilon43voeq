<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Natal na Aldeia · private preview · Vinogrande</title>
<link rel="stylesheet" href="assets/vg-aaa.css?v=a0ffa7f6">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#1a080c;color:#f3e6d0;font-family:Jost,system-ui,sans-serif;min-height:100%;}
  .pv-bar{position:sticky;top:0;z-index:80;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
    padding:8px 12px;background:#2a020c;color:#e8cf88;font-size:12px;line-height:1.3;
    border-bottom:1px solid rgba(232,207,136,.35);}
  .pv-bar a{color:#e8cf88}
  .pv-tag{display:inline-block;padding:2px 8px;border-radius:999px;border:1px solid #e8cf88;
    text-transform:uppercase;letter-spacing:.04em;font-weight:600;font-size:10px;}
  .pv-note{flex:1 1 180px;opacity:.9}
  main{padding:8px 12px 24px;}
  .vgq-host{min-height:70vh}
</style>
</head>
<body>
<div class="pv-bar">
  <strong>Private preview</strong>
  <span class="pv-tag">work in progress</span>
  <span class="pv-note">Sunday 29 Nov candidate, game md5 63c391f6. Not published. Prize codes in this preview are fake (TEST only).</span>
  <a href="index.html">All games</a>
</div>
<main id="MainContent"></main>
<script>
(function(){
  window.__VGA_LANG = 'pt';
  document.documentElement.lang = 'pt';
  window.__VGA_BASE = 'https://wtrpbbqtgpzufnqhkvmv.supabase.co/storage/v1/object/public/vgt-zalwmw4k1x2nilon43voeq/assets/';
  window.__VGA_SRC = window.__VGA_SRC || {};
  window.__VGA_SRC.aldeia = 'assets/vg-aaa-g-aldeia.js?v=63c391f6';
  window.__VGA_PRIZE_MOCK = function(id, stars){
    window.__vgaClaims = (window.__vgaClaims || []).concat([{id:id, stars:stars}]);
    var p = stars >= 3 ? 10 : stars >= 2 ? 5 : 0;
    return p ? {ok:true, pct:p, code:'VG-PREVIEW'+p+'-TEST', ends:'2026-12-24T23:59:59Z'} : {ok:true, pct:0, code:null};
  };
  document.addEventListener('click', function(e){
    var a = e.target && e.target.closest && e.target.closest('a');
    if (!a) return;
    var href = a.getAttribute('href') || '';
    if (/^https?:\/\/(www\.)?vinogrande\.(pt|es)/i.test(href)) return;
    var m = href.match(/^(?:https?:\/\/[^/]+)?(\/(?:en|es)\/)?(\/products\/[^?#]+)/i)
         || href.match(/^(\/(?:en|es))?(\/products\/[^?#]+)/i)
         || href.match(/^(\/(?:en|es))?(\/discount\/[^?#]+)/i);
    if (m) {
      e.preventDefault();
      var lang = (m[1] || '');
      window.open('https://vinogrande.pt' + lang + m[2], '_blank', 'noopener');
    }
  }, true);
  var s = document.createElement('script');
  s.src = 'https://wtrpbbqtgpzufnqhkvmv.supabase.co/storage/v1/object/public/vgt-zalwmw4k1x2nilon43voeq/assets/vg-aaa.js';
  s.onload = function(){
    var h = document.createElement('div');
    h.className = 'vgq-host';
    document.getElementById('MainContent').appendChild(h);
    if (window.vgAAA) window.vgAAA('aldeia', h);
    else if (window.VGAAA && window.VGAAA.launch) window.VGAAA.launch('aldeia', {host:h});
  };
  s.onerror = function(){ document.getElementById('MainContent').innerHTML = '<p>Failed to load the game shell.</p>'; };
  document.head.appendChild(s);
})();
</script>
</body>
</html>
